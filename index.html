 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstantLead Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #0f172a; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    input, textarea, button { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { background: #2563eb; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:disabled { background: #94a3b8; }
    .lead-card { border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 8px; border-radius: 8px; background: #ffffff; }
    .lead-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
    .lead-phone { color: #2563eb; text-decoration: none; display: inline-block; margin-bottom: 4px; }
    .lead-msg { color: #475569; margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="auth-view">
      <h2>InstantLead Login</h2>
      <input type="email" id="email" placeholder="Your Email" required>
      <input type="password" id="password" placeholder="Your Password" required>
      <button id="login-btn" onclick="handleLogin()">Log In</button>
    </div>

    <div id="dashboard-view" class="hidden">
      <h2>Your Embed Code</h2>
      <textarea id="embed-code" readonly style="height: 80px; font-family: monospace;"></textarea>

      <h2>Your Leads</h2>
      <div id="leads-list">Loading leads...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://waatnxffylvlfqtlznzv.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_WeghbAEB6DM-UBxu9W61tw_rqHWNd-J';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      btn.innerText = 'Logging in...';
      btn.disabled = true;

      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert(error.message);
        btn.innerText = 'Log In';
        btn.disabled = false;
      } else {
        showDashboard();
      }
    }

    async function showDashboard() {
      authView.classList.add('hidden');
      dashboardView.classList.remove('hidden');

      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
        const snippet = `<script src="https://alexeceo.github.io/InstantLead/widget.js" data-owner-id="${user.id}" data-owner-email="${user.email}"><\/script>`;
        document.getElementById('embed-code').value = snippet;
      }
      fetchLeads();
    }

    async function fetchLeads() {
      const listContainer = document.getElementById('leads-list');
      listContainer.innerHTML = 'Loading leads...';

      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) {
        listContainer.innerHTML = '<p style="color:#ef4444;">Please log in.</p>';
        return;
      }

      const { data: leads, error } = await _supabase
        .from('leads')
        .select('*')
        .eq('user_id', user.id)
        .order('id', { ascending: false });

      if (error) {
        listContainer.innerHTML = `<p style="color:#ef4444;">Error loading leads: ${error.message}</p>`;
        return;
      }

      if (!leads || leads.length === 0) {
        listContainer.innerHTML = '<p>No leads received yet.</p>';
        return;
      }

      listContainer.innerHTML = leads.map(lead => `
        <div class="lead-card">
          <div class="lead-name">${lead.name || 'Anonymous'}</div>
          <a class="lead-phone" href="tel:${lead.phone}">${lead.phone || 'No phone'}</a>
          <p class="lead-msg">${lead.message || 'No message provided'}</p>
        </div>
      `).join('');
    }

    // Auto-check auth state on load
    _supabase.auth.getUser().then(({ data: { user } }) => {
      if (user) showDashboard();
    });
  </script>
</body>
</html>
