 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstantLead - Business Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    .card { background-color: #121826; border: 1px solid #1f293d; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    h2, h3 { margin-top: 0; color: #ffffff; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 12px; background-color: #1a2332; border: 1px solid #2a364f; border-radius: 8px; color: #ffffff; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: #6366f1; }
    .btn { width: 100%; padding: 14px; background-color: #6366f1; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background-color: #4f46e5; }
    .btn-secondary { background-color: #1a2332; color: #94a3b8; border: 1px solid #2a364f; margin-top: 12px; }
    .btn-secondary:hover { background-color: #2a364f; color: #ffffff; }
    .hidden { display: none !important; }
    .status-msg { margin-top: 12px; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <!-- LEAD CAPTURE FORM VIEW -->
    <div id="lead-view" class="card">
      <h2>Request Immediate Callback</h2>
      <p>Leave your contact details and an available agent will reply within 15 minutes.</p>
      
      <form id="lead-form">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="lead-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="lead-phone" placeholder="+1 555 000 0000" required>
        </div>
        <div class="form-group">
          <label>What do you need help with?</label>
          <textarea id="lead-message" rows="3" placeholder="Briefly describe what you're looking for..."></textarea>
        </div>
        <button type="submit" class="btn">Submit Request</button>
      </form>
      
      <div id="lead-status" class="status-msg"></div>

      <button id="show-login-btn" class="btn btn-secondary">Business Owner Login</button>
    </div>

    <!-- LOGIN VIEW -->
    <div id="login-view" class="card hidden">
      <h2>Owner Portal</h2>
      <p>Log in to access your incoming business leads.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="owner@business.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn">Log In</button>
      </form>
      
      <div id="login-status" class="status-msg"></div>

      <button id="show-capture-btn" class="btn btn-secondary">Back to Request Form</button>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" class="card hidden">
      <h2>Incoming Leads</h2>
      <p>Manage warm leads requesting immediate callbacks.</p>
      <div id="leads-list">
        <p>No leads received yet.</p>
      </div>
      <button id="logout-btn" class="btn btn-secondary">Log Out</button>
    </div>
  </div>

  <script>
    // View Switchers
    const leadView = document.getElementById('lead-view');
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');

    document.getElementById('show-login-btn').addEventListener('click', () => {
      leadView.classList.add('hidden');
      loginView.classList.remove('hidden');
    });

    document.getElementById('show-capture-btn').addEventListener('click', () => {
      loginView.classList.add('hidden');
      leadView.classList.remove('hidden');
    });

    // Form Handling
    document.getElementById('lead-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const status = document.getElementById('lead-status');
      status.style.color = '#4ade80';
      status.textContent = 'Request submitted successfully! We will contact you shortly.';
      document.getElementById('lead-form').reset();
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      dashboardView.classList.add('hidden');
      leadView.classList.remove('hidden');
    });
  </script>

</body>
</html>
