 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstantLead Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
    .hidden { display: none !important; }
    h2, h3 { margin-top: 0; color: #f8fafc; }
    input, textarea { width: 100%; background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
    input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
    button { width: 100%; background-color: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 12px; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #475569; cursor: not-allowed; }
    .btn-secondary { background-color: #334155; margin-bottom: 0; }
    .btn-secondary:hover { background-color: #475569; }
    .toggle-link { color: #38bdf8; text-align: center; font-size: 13px; cursor: pointer; margin-top: 8px; text-decoration: underline; }
    .embed-box { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 20px; }
    .embed-box label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; font-weight: bold; }
    textarea.code-snippet { height: 90px; font-family: monospace; font-size: 12px; color: #38bdf8; resize: none; margin-bottom: 8px; }
    .lead-card { background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .lead-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .lead-name { font-weight: bold; color: #f8fafc; }
    .lead-phone { color: #38bdf8; text-decoration: none; font-size: 14px; }
    .lead-msg { color: #cbd5e1; margin: 6px 0 0 0; font-size: 13px; word-break: break-word; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logout-btn { width: auto; background-color: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; font-size: 12px; margin-bottom: 0; }
    .logout-btn:hover { background-color: #ef4444; color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <!-- AUTH VIEW (LOGIN / SIGNUP) -->
    <div id="auth-view">
      <h2 id="auth-title">InstantLead Login</h2>
      <input type="email" id="email" placeholder="Your Email" required />
      <input type="password" id="password" placeholder="Your Password" required />
      <button id="auth-btn" onclick="handleAuth()">Log In</button>
      <div id="toggle-auth" class="toggle-link" onclick="toggleAuthMode()">Don't have an account? Sign Up</div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view" class="hidden">
      <div class="header-bar">
        <h2>Dashboard</h2>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>
      
      <!-- Copy Embed Code Box -->
      <div class="embed-box">
        <label>YOUR WIDGET EMBED CODE</label>
        <textarea id="embed-code" class="code-snippet" readonly></textarea>
        <button onclick="copySnippet()" class="btn-secondary">Copy Code</button>
      </div>

      <h3>Your Received Leads</h3>
      <div id="leads-list">Loading leads...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://waatnxffylvlfqtlznzv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WeghbAEB6DM-UBxu9W61tw_rqHWNd-J';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUpMode = false;

    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');
    const authTitle = document.getElementById('auth-title');
    const authBtn = document.getElementById('auth-btn');
    const toggleAuth = document.getElementById('toggle-auth');

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      if (isSignUpMode) {
        authTitle.innerText = 'Create Account';
        authBtn.innerText = 'Sign Up';
        toggleAuth.innerText = 'Already have an account? Log In';
      } else {
        authTitle.innerText = 'InstantLead Login';
        authBtn.innerText = 'Log In';
        toggleAuth.innerText = "Don't have an account? Sign Up";
      }
    }

    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        alert('Please fill in both email and password.');
        return;
      }

      authBtn.disabled = true;

      if (isSignUpMode) {
        authBtn.innerText = 'Creating account...';
        const { data, error } = await _supabase.auth.signUp({ email, password });
        if (error) {
          alert('Sign Up failed: ' + error.message);
          authBtn.innerText = 'Sign Up';
          authBtn.disabled = false;
        } else {
          alert('Account created successfully! Logging you in...');
          showDashboard();
        }
      } else {
        authBtn.innerText = 'Logging in...';
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
          alert('Login failed: ' + error.message);
          authBtn.innerText = 'Log In';
          authBtn.disabled = false;
        } else {
          showDashboard();
        }
      }
    }

    async function handleLogout() {
      await _supabase.auth.signOut();
      dashboardView.classList.add('hidden');
      authView.classList.remove('hidden');
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      authBtn.disabled = false;
      if (isSignUpMode) toggleAuthMode();
    }

    async function showDashboard() {
      authView.classList.add('hidden');
      dashboardView.classList.remove('hidden');

      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
        // Embed snippet passes both owner_id and owner_email to widget.js
        const snippet = `<script src="https://alexeceo.github.io/InstantLead/widget.js" data-owner-id="${user.id}" data-owner-email="${user.email}"><\/script>`;
        document.getElementById('embed-code').value = snippet;
      }
      fetchLeads();
    }

    function copySnippet() {
      const copyText = document.getElementById('embed-code');
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      alert("Embed code copied to clipboard!");
    }

    async function fetchLeads() {
      const listContainer = document.getElementById('leads-list');
      listContainer.innerHTML = '<p style="color:#94a3b8;">Loading leads...</p>';

      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) {
        listContainer.innerHTML = '<p style="color:#ef4444;">Please log in.</p>';
        return;
      }

      const { data: leads, error } = await _supabase
        .from('leads')
        .select('*')
        .eq('user_id', user.id)
        .order('id', { ascending: false });

      if (error) {
        listContainer.innerHTML = `<p style="color:#ef4444;">Error loading leads: ${error.message}</p>`;
        return;
      }

      if (!leads || leads.length === 0) {
        listContainer.innerHTML = '<p style="color:#94a3b8;">No leads received yet.</p>';
        return;
      }

      listContainer.innerHTML = leads.map(lead => `
        <div class="lead-card">
          <div class="lead-header">
            <span class="lead-name">${lead.name || 'Anonymous'}</span>
            <a class="lead-phone" href="tel:${lead.phone}">${lead.phone || 'No phone'}</a>
          </div>
          <p class="lead-msg">${lead.message || 'No message provided'}</p>
        </div>
      `).join('');
    }

    // Auto-check existing session on load
    _supabase.auth.getUser().then(({ data: { user } }) => {
      if (user) showDashboard();
    });
  </script>
</body>
</html>
