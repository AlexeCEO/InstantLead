 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstantLead - Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }
    .card { background-color: #121826; border: 1px solid #1f293d; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px; }
    .hidden { display: none !important; }
    h2, h3 { margin-top: 0; color: #ffffff; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background-color: #1a2332; border: 1px solid #2a364f; border-radius: 6px; color: #ffffff; font-size: 14px; box-sizing: border-box; }
    .btn { width: 100%; padding: 14px; background-color: #6366f1; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 8px; }
    .btn-secondary { background-color: #1a2332; color: #94a3b8; border: 1px solid #2a364f; margin-top: 10px; }
    .lead-card { background: #1a2332; border: 1px solid #2a364f; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .lead-name { font-weight: 700; font-size: 16px; color: #ffffff; margin-bottom: 4px; }
    .lead-phone { color: #6366f1; font-weight: 600; text-decoration: none; display: inline-block; margin-bottom: 8px; }
    .lead-msg { color: #94a3b8; font-size: 13px; margin: 0; }
    .embed-box { width: 100%; padding: 10px; background: #0b0f17; border: 1px solid #2a364f; color: #4ade80; font-family: monospace; font-size: 12px; border-radius: 6px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <!-- AUTH SECTION -->
    <div id="auth-view" class="card">
      <h2>InstantLead Portal</h2>
      <p>Log in or register to manage your website widget.</p>
      
      <div id="login-box">
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required>
          </div>
          <button type="submit" class="btn" id="login-btn">Log In</button>
        </form>
        <button class="btn btn-secondary" id="to-signup">Need an account? Sign Up</button>
      </div>

      <div id="signup-box" class="hidden">
        <form id="signup-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signup-password" required>
          </div>
          <button type="submit" class="btn" id="signup-btn">Create Free Account</button>
        </form>
        <button class="btn btn-secondary" id="to-login">Already have an account? Log In</button>
      </div>
      
      <div id="auth-status" style="margin-top: 12px; text-align: center; font-size: 13px;"></div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-view" class="card hidden">
      <h2>Your Lead Dashboard</h2>
      
      <div class="form-group">
        <label>Your Custom Embed Code</label>
        <textarea id="embed-code" class="embed-box" rows="3" readonly></textarea>
        <button class="btn btn-secondary" id="copy-btn">Copy Embed Code</button>
      </div>

      <h3>Incoming Leads</h3>
      <div id="leads-list">Loading leads...</div>

      <button class="btn btn-secondary" id="logout-btn" style="margin-top: 20px;">Log Out</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://waatnxffylvlfqtlznzv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WeghbAEB6DM-UBxu9W61tw_rqHWNd-J';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginBox = document.getElementById('login-box');
    const signupBox = document.getElementById('signup-box');
    const authStatus = document.getElementById('auth-status');

    // Toggle forms
    document.getElementById('to-signup').onclick = () => { loginBox.classList.add('hidden'); signupBox.classList.remove('hidden'); authStatus.textContent = ''; };
    document.getElementById('to-login').onclick = () => { signupBox.classList.add('hidden'); loginBox.classList.remove('hidden'); authStatus.textContent = ''; };

    // Sign Up
    document.getElementById('signup-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const btn = document.getElementById('signup-btn');
      btn.textContent = 'Creating Account...'; btn.disabled = true;

      const { data, error } = await _supabase.auth.signUp({ email, password });
      if (error) {
        authStatus.style.color = '#ef4444'; authStatus.textContent = error.message;
      } else {
        authStatus.style.color = '#4ade80'; authStatus.textContent = 'Account created!';
        setTimeout(() => showDashboard(), 1000);
      }
      btn.textContent = 'Create Free Account'; btn.disabled = false;
    };

    // Log In
    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Logging In...'; btn.disabled = true;

      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) {
        authStatus.style.color = '#ef4444'; authStatus.textContent = error.message;
      } else {
        authStatus.textContent = '';
        showDashboard();
      }
      btn.textContent = 'Log In'; btn.disabled = false;
    };

    // Show Dashboard
    async function showDashboard() {
      authView.classList.add('hidden');
      dashboardView.classList.remove('hidden');

      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
        const snippet = '<script src="https://alexeceo.github.io/InstantLead/widget.js" data-owner-id="' + user.id + '"><' + '/script>';
        document.getElementById('embed-code').value = snippet;
      }
      fetchLeads();
    }

    // Fetch Leads
    async function fetchLeads() {
      const listContainer = document.getElementById('leads-list');
      listContainer.innerHTML = 'Loading leads...';

      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) return;

      const { data: leads, error } = await _supabase
        .from('leads')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      if (error || !leads || leads.length === 0) {
        listContainer.innerHTML = '<p>No leads received yet.</p>';
        return;
      }

      listContainer.innerHTML = leads.map(lead => `
        <div class="lead-card">
          <div class="lead-name">${lead.name || 'Anonymous'}</div>
          <a class="lead-phone" href="tel:${lead.phone}">📞 ${lead.phone}</a>
          <p class="lead-msg">${lead.message || 'No message provided.'}</p>
        </div>
      `).join('');
    }

    // Copy Embed Code
    document.getElementById('copy-btn').onclick = () => {
      const embedInput = document.getElementById('embed-code');
      embedInput.select();
      navigator.clipboard.writeText(embedInput.value);
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy Embed Code', 2000);
    };

    // Log Out
    document.getElementById('logout-btn').onclick = async () => {
      await _supabase.auth.signOut();
      dashboardView.classList.add('hidden');
      authView.classList.remove('hidden');
    };

    // Auto-login check
    _supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) showDashboard();
    });
  </script>
</body>
          </html>
